<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- Sin zoom de página (sensación de app). El visor amplía solamente el contenido del menú. -->
    <meta
      id="viewport"
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Mapa colaborativo de menús QR" />

    <!-- App instalable (pantalla de inicio) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FoodTrack" />
    <!-- Barra de estado de iOS transparente: la app se dibuja debajo de la hora y pinta esa franja
         con su propio color (fondo en oscuro, naranja en claro). iOS toma este valor al AGREGAR la app
         a la pantalla de inicio: si cambia, hay que borrarla y volver a agregarla. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFF7EE" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Marca de la app local y tema guardado, antes del primer render. Va en un archivo aparte
         porque la Content-Security-Policy (vercel.json) no permite scripts en línea. -->
    <script src="/boot.js"></script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> Necesitás JavaScript para usar FoodTrack. </noscript>
    <div id="root"></div>
  </body>
</html>
